<html lang="es">
<head>

<style>
  :root{
    --lav:#DBC0E8; --sky:#A3C1E2; --daff:#F7E289; --night:#252D45; --peach:#FBB28B; --poppy:#F76F54;
    --sage:#A8AF95; --fuchsia:#EA5E86; --pool:#47B5A8; --cotton:#F9A2C5; --egg:#6B515E; --hay:#B79A65;
    --bg:#FBF7F0; --card:#FFFFFF; --ink:#252D45; --mute:#6B6F80; --line:#ECE6DA; --soft:#F3EEE4;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1B2133; --card:#252D45; --ink:#FBF7F0; --mute:#A9AEC2; --line:#323B58; --soft:#2E3752; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Lexend",-apple-system,system-ui,sans-serif}
  body{padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 96px)}
  .wrap{max-width:540px;margin:0 auto}
  h1{font-size:28px;font-weight:800;margin:2px 0;letter-spacing:-.5px}
  h2{font-size:20px;font-weight:700;margin:0}
  .cap{font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:13px}
  .sub{color:var(--mute);font-size:14px}
  .row{display:flex;gap:8px;align-items:center}
  .between{justify-content:space-between}
  .grow{flex:1;min-width:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin:14px 0}
  .tile{border-radius:22px;padding:16px;margin:14px 0;color:#252D45}
  .tile .sub{color:#252D45;opacity:.7}
  .head{border-radius:16px;padding:10px 14px;margin:-6px -6px 10px;color:#252D45;display:flex;justify-content:space-between;align-items:center}
  button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
  .btn{background:var(--btn,var(--night));color:var(--btnt,#FBF7F0);border-radius:16px;padding:14px 18px;font-weight:700;font-size:16px;width:100%}

  .btn.ok{background:var(--pool);color:#fff}
  .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
  .btn.small{width:auto;padding:9px 14px;font-size:14px;border-radius:12px}
  .link{color:var(--ink);padding:6px 2px;font-weight:600;text-decoration:underline;text-underline-offset:3px;font-size:14px}
  .link.mute{color:var(--mute);text-decoration:none}
  a.btn{display:block;text-align:center;text-decoration:none;box-sizing:border-box}
  .spot{background:#1DB954!important;color:#fff!important}
  input,select,textarea{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
  textarea{resize:vertical;min-height:44px}
  /* En iPhone los campos de fecha/hora tienen un ancho mínimo propio y se salían de las tarjetas */
  input[type=date],input[type=time],input[type=datetime-local]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:44px;line-height:1.2;text-align:left}
  input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value,input[type=datetime-local]::-webkit-date-and-time-value{text-align:left;min-height:1.2em}
  .row>input,.row>select,.row>label{min-width:0}
  .flabel{font-size:13px;color:var(--mute);margin:10px 0 4px}
  .pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;color:#252D45}
  .list .it{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
  .list .it:last-child{border-bottom:0}
  .chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--mute);flex:none;display:grid;place-items:center;font-size:15px;font-weight:800}
  .chk.on{border-color:transparent;color:#fff}
  .done-t{text-decoration:line-through;color:var(--mute)}
  .x{color:var(--mute);font-size:18px;padding:4px 6px}
  .dots{display:flex;gap:4px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
  .tlb{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.tlb.drag{box-shadow:0 8px 24px #0004;z-index:9!important;opacity:.92}
  .tlm{position:absolute;top:0;right:0;width:26px;height:26px;touch-action:none;cursor:grab;z-index:3}.tlm::after{content:"";position:absolute;top:5px;right:5px;width:10px;height:12px;opacity:.5;background:radial-gradient(circle,currentColor 1.4px,transparent 1.6px) 0 0/5px 4px}
  .tlh{position:absolute;left:50%;bottom:2px;width:44px;margin-left:-22px;height:14px;touch-action:none;cursor:ns-resize}.tlh::after{content:"";position:absolute;left:10px;right:10px;top:5px;height:4px;border-radius:3px;background:currentColor;opacity:.35}
  .ev{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .ev:last-child{border-bottom:0}
  .ev .bar{width:5px;border-radius:5px;flex:none}
  .ev .time{font-size:13px;color:var(--mute);min-width:46px;font-variant-numeric:tabular-nums}
  .daylbl{font-weight:800;margin:16px 0 4px;text-transform:capitalize}
  .tabs{position:fixed;left:0;right:0;bottom:0;background:var(--tabs,var(--card));border-top:1px solid var(--line);
    padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);display:flex;justify-content:space-around;z-index:5}
  .tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mute);padding:4px 8px;border-radius:12px;min-width:58px}
  .tabs button .ic{font-size:20px;line-height:1}
  .tabs button.on{color:var(--ink);background:var(--soft)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .day{border-radius:20px;padding:14px;text-align:left;color:#252D45;min-height:92px}
  .day b{display:block;font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
  .day span{font-size:13px;opacity:.75}
  .step{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0}
  .step label{font-size:14px;color:var(--mute);min-width:64px}
  .step .ctl{display:flex;align-items:center;gap:6px}
  .step button{width:48px;height:48px;border-radius:14px;background:var(--soft);font-size:22px;font-weight:700}
  .step input{width:84px;height:48px;text-align:center;font-size:22px;font-weight:700;padding:0}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{background:var(--pool);color:#fff;border-radius:10px;padding:5px 10px;font-weight:700;font-size:14px}
  .chip.prev{background:var(--soft);color:var(--mute)}
  .big{font-size:84px;font-weight:800;letter-spacing:-2px;text-align:center;margin:6px 0;font-variant-numeric:tabular-nums}
  .center{text-align:center}
  .pbar{height:7px;background:rgba(37,45,69,.15);border-radius:7px;overflow:hidden;margin-top:10px}
  .pbar i{display:block;height:100%;background:var(--night)}
  @media (prefers-color-scheme: dark){ html:not(.light) .pbar{background:var(--line)} html:not(.light) .pbar i{background:var(--daff)} }
  html.dark .pbar{background:var(--line)} html.dark .pbar i{background:var(--daff)}
  .sw{width:50px;height:30px;border-radius:30px;background:var(--line);position:relative;flex:none}
  .sw.on{background:var(--pool)}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s}
  .sw.on::after{left:23px}
  .note{font-size:13px;color:var(--mute);margin-top:6px}
  .toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 84px);max-width:508px;margin:0 auto;
    background:var(--night);color:#FBF7F0;border-radius:16px;padding:12px 16px;text-align:center;z-index:9}
  .pocket{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#5a5a5a;text-align:center;padding:24px;touch-action:none;user-select:none;-webkit-user-select:none}
  .pocket .pc{font-size:96px;font-weight:800;color:#6b6b6b;font-variant-numeric:tabular-nums;letter-spacing:-2px}
  .pocket .ring{width:84px;height:84px;border-radius:50%;border:3px solid #333;margin-top:28px;display:grid;place-items:center;font-size:12px;color:#555}
  .pocket .ring.hold{border-color:#47B5A8;color:#47B5A8}
  .seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px;margin:10px 0}
  .seg button{flex:1;padding:8px;border-radius:10px;font-weight:600;font-size:14px;color:var(--mute)}
  .seg button.on{background:var(--card);color:var(--ink)}
  .meal{display:grid;grid-template-columns:92px 1fr auto;gap:6px;align-items:center;margin:6px 0}
  .meal span{font-size:13px;color:var(--mute)}
</style>
</head>

<script>
/* ================= UTILIDADES ================= */
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const isoLocal=d=>`${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}:00`;

const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const parseYmd=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const fmtDay=(d,o)=>d.toLocaleDateString("es-ES",o||{weekday:"long",day:"numeric",month:"long"});
const fmtTime=d=>d.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});
const num=v=>{const x=parseFloat(String(v).replace(",","."));return isNaN(x)?0:x};
const kgTxt=x=>(Math.round(x*10)/10).toString().replace(".",",");
const clone=o=>JSON.parse(JSON.stringify(o));
const C0={lav:"#DBC0E8",sky:"#A3C1E2",daff:"#F7E289",night:"#252D45",peach:"#FBB28B",poppy:"#F76F54",sage:"#A8AF95",
  fuchsia:"#EA5E86",pool:"#47B5A8",cotton:"#F9A2C5",egg:"#6B515E",hay:"#B79A65"};
const C=Object.assign({},C0);
/* ---------- Apariencia: paletas, modo claro/oscuro y colores a mano ---------- */
const KEYS=["lav","sky","daff","peach","poppy","sage","fuchsia","pool","cotton","egg","hay","night"];
const KNAME={lav:"Lila",sky:"Azul",daff:"Amarillo",peach:"Melocotón",poppy:"Rojo",sage:"Verde suave",fuchsia:"Fucsia",pool:"Turquesa",cotton:"Rosa",egg:"Berenjena",hay:"Tierra",night:"Oscuro"};
const PALETAS={
  nordico:{n:"Pastel nórdico",c:C0,bg:"#FBF7F0"},
  mia:{n:"Mi paleta",c:{lav:"#C8A2C8",sky:"#BFD7EA",daff:"#F6E27F",peach:"#F8C8B0",poppy:"#E8603C",sage:"#A3A86B",fuchsia:"#F28DB2",pool:"#5E9C76",cotton:"#C9E4C5",egg:"#7A5C8E",hay:"#C2A37E",night:"#2B2D42"},bg:"#FAF8F3"},
  oceano:{n:"Océano",c:{lav:"#B8C6F0",sky:"#9FD3EC",daff:"#F3E6A8",peach:"#F6C3A6",poppy:"#EF6F6C",sage:"#9CC5B9",fuchsia:"#E58FB5",pool:"#2FA4A9",cotton:"#B6E2E8",egg:"#4E5D8C",hay:"#8FB3C9",night:"#1E2A3A"},bg:"#F4F8FB"},
  atardecer:{n:"Atardecer",c:{lav:"#E3B7D2",sky:"#F2C6A0",daff:"#FFD982",peach:"#FFB38A",poppy:"#F2545B",sage:"#C9B79C",fuchsia:"#E86A92",pool:"#F28C38",cotton:"#FFC8C2",egg:"#8C4A5E",hay:"#D9A066",night:"#3A2632"},bg:"#FFF8F1"},
  bosque:{n:"Bosque",c:{lav:"#C7C3E0",sky:"#B7D3C6",daff:"#E9DE9A",peach:"#E8C2A0",poppy:"#D7664F",sage:"#9DB58A",fuchsia:"#D98FA6",pool:"#4F8A6B",cotton:"#D5E8C4",egg:"#5B6B4E",hay:"#B59A6A",night:"#22302A"},bg:"#F6F7F1"},
  suave:{n:"Gris suave",c:{lav:"#D9D6E6",sky:"#D3DEE8",daff:"#ECE6C8",peach:"#EBD8CB",poppy:"#D98880",sage:"#C9CFC2",fuchsia:"#DDB7C6",pool:"#8FB9B3",cotton:"#EAD9DE",egg:"#6E6A75",hay:"#CDBFA8",night:"#2E2E33"},bg:"#F7F7F5"}};
const tema=()=>Object.assign({modo:"auto",paleta:"nordico",custom:{}},S.app.tema||{});
let _temaSig="";
function applyTheme(){
  const t=tema(), sig=JSON.stringify(t); if(sig===_temaSig) return; _temaSig=sig;
  const P=PALETAS[t.paleta]||PALETAS.nordico; Object.assign(C,C0,P.c,t.custom||{});
  try{ if(typeof EVCOL!=="undefined") Object.assign(EVCOL,{"1":C.lav,"2":C.sage,"3":C.fuchsia,"4":C.cotton,"5":C.daff,"6":C.peach,"7":C.pool,"8":C.hay,"9":C.sky,"10":C.pool,"11":C.poppy}); }catch(e){}
  try{ if(typeof HCOL!=="undefined") HCOL.splice(0,HCOL.length,C.pool,C.fuchsia,C.sky,C.hay,C.lav,C.poppy,C.sage,C.egg); }catch(e){}
  try{ if(typeof VTIPOS!=="undefined"){ const ro=t.roles||{}; VTIPOS.vocab.col=ro["ing:vocab"]||C.sky; VTIPOS.error.col=ro["ing:error"]||C.poppy; VTIPOS.frase.col=ro["ing:frase"]||C.pool } }catch(e){}
  try{ if(typeof DEF_ASIG!=="undefined"){ const m={rxdet:"pool",ee:"peach",aa:"sage",mn:"lav"}; for(const a of DEF_ASIG) a.col=C[m[a.id]] } }catch(e){}
  try{ if(typeof DEF_RUTINA!=="undefined"){ const m={lunes:"lav",martes:"sky",miercoles:"peach",jueves:"daff",viernes:"cotton",sabado:"pool",domingo:"sage"}; for(const r of DEF_RUTINA) r.col=C[m[r.id]] } }catch(e){}
  const R=document.documentElement, dark=t.modo==="oscuro"||(t.modo==="auto"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
  R.classList.toggle("dark",t.modo==="oscuro"); R.classList.toggle("light",t.modo==="claro");
  const v=dark?{"--bg":C.night==="#252D45"?"#1B2133":shade(C.night,-.25),"--card":C.night,"--ink":"#FBF7F0","--mute":"#A9AEC2","--line":shade(C.night,.12),"--soft":shade(C.night,.07)}
             :{"--bg":t.custom&&t.custom.bg||P.bg,"--card":"#FFFFFF","--ink":C.night,"--mute":"#6B6F80","--line":"#ECE6DA","--soft":"#F3EEE4"};
  const ro=t.roles||{};
  if(ro["ui:bg"]&&!dark) v["--bg"]=ro["ui:bg"]; if(ro["ui:bgd"]&&dark) v["--bg"]=ro["ui:bgd"];
  if(ro["ui:card"]&&!dark) v["--card"]=ro["ui:card"]; if(ro["ui:text"]&&!dark) v["--ink"]=ro["ui:text"];
  const btn=ro["ui:btn"]||(dark?C.daff:C.night); v["--btn"]=btn; v["--btnt"]=txtOn(btn);
  v["--tabs"]=ro["ui:tabs"]||v["--card"];
  for(const k of KEYS) R.style.setProperty("--"+k,C[k]);
  for(const [k,x] of Object.entries(v)) R.style.setProperty(k,x);
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute("content",v["--bg"]);
}
const roles=()=>tema().roles||{};
function RC(role,key){ const r=roles()[role]; return r||(C[key]||key) }
function txtOn(hex){ try{ const n=parseInt(String(hex).slice(1),16), r=n>>16,g=(n>>8)&255,b=n&255; return (0.299*r+0.587*g+0.114*b)>150?"#252D45":"#FFFFFF" }catch(e){ return "#252D45" } }
function hs(role,key){ const c=RC(role,key); return `background:${c};color:${txtOn(c)}` }
function setRole(role,val){ const r=Object.assign({},roles()); if(val) r[role]=val; else delete r[role]; setTema({roles:r}) }
function shade(hex,amt){ const n=parseInt(hex.slice(1),16); let r=n>>16,g=(n>>8)&255,b=n&255; const f=x=>Math.max(0,Math.min(255,Math.round(amt>0?x+(255-x)*amt:x*(1+amt)))); return "#"+[f(r),f(g),f(b)].map(x=>x.toString(16).padStart(2,"0")).join("") }
function remapStored(fromC,toC){ // pasa los colores guardados (asignaturas, rutina) de una paleta a otra
  const inv={}; for(const k of KEYS) if(fromC[k]) inv[fromC[k].toLowerCase()]=k;
  const tr=h=>{ const k=h&&inv[String(h).toLowerCase()]; return k?toC[k]:h };
  if(S.app.estudio&&S.app.estudio.asig) saveEst({asig:asigs().map(a=>Object.assign({},a,{col:tr(a.col)}))});
  if(S.app.rutina&&S.app.rutina.dias) saveRut(rutina().map(r=>Object.assign({},r,{col:tr(r.col)})));
}
function setTema(p){ const before=Object.assign({},C); const t=Object.assign({},tema(),p); putDoc("app","tema",t); _temaSig=""; applyTheme(); remapStored(before,C); render() }
/* Editor de colores por partes de la app */
let colOpen={};
function colRow(label,cur,on,custom,reset){
  return `<div class="row between" style="padding:7px 0;border-bottom:1px solid var(--line)"><span style="font-size:14px">${label}</span>
    <span class="row" style="gap:6px">${custom?`<button class="link mute" style="font-size:12px" onclick="${reset}">↺</button>`:""}<input type="color" value="${cur}" style="width:46px;height:34px;padding:0;border:0;background:none;min-height:0" onchange="${on}"></span></div>`;
}
const rRow=(label,role,key)=>colRow(label,RC(role,key),`setRole('${role}',this.value)`,!!roles()[role],`setRole('${role}','')`);

function vColoresPartes(){
  const P=PALETAS[tema().paleta]||PALETAS.nordico, H=(l,t,k)=>rRow(l,"h:"+t,k);
  const g=[
    ["ui","🖼️ General",
      colRow("Fondo (modo claro)",roles()["ui:bg"]||P.bg,`setRole('ui:bg',this.value)`,!!roles()["ui:bg"],`setRole('ui:bg','')`)+
      colRow("Fondo (modo oscuro)",roles()["ui:bgd"]||"#1B2133",`setRole('ui:bgd',this.value)`,!!roles()["ui:bgd"],`setRole('ui:bgd','')`)+
      colRow("Tarjetas",roles()["ui:card"]||"#FFFFFF",`setRole('ui:card',this.value)`,!!roles()["ui:card"],`setRole('ui:card','')`)+
      colRow("Texto",roles()["ui:text"]||C.night,`setRole('ui:text',this.value)`,!!roles()["ui:text"],`setRole('ui:text','')`)+
      colRow("Botones",roles()["ui:btn"]||C.night,`setRole('ui:btn',this.value)`,!!roles()["ui:btn"],`setRole('ui:btn','')`)+
      colRow("Barra de abajo",roles()["ui:tabs"]||"#FFFFFF",`setRole('ui:tabs',this.value)`,!!roles()["ui:tabs"],`setRole('ui:tabs','')`)],

const COLS=["tareas","compra","habitoslog","app","sesiones","tfglog","foco","vocab","notas","peso","recetas"];

let db=null, dbState="cargando", chains={};
function putDoc(col,id,obj){
  obj=clone(obj); S[col][id]=obj; LS.set("v2_"+col,S[col]); schedule();
  if(!db) return; const k=col+"/"+id;
  chains[k]=(chains[k]||Promise.resolve()).then(()=>db.doc(k).set(obj)).catch(e=>{ if(e&&e.code==="quota_exceeded") toast("No queda espacio para guardar más"); });
}
function removeDoc(col,id){
  delete S[col][id]; LS.set("v2_"+col,S[col]); schedule();
  if(!db) return; const k=col+"/"+id;
  chains[k]=(chains[k]||Promise.resolve()).then(()=>db.doc(k).delete()).catch(()=>{});
}
async function initDb(){
  try{ db=await window.claude?.use?.("db") ?? null }catch(e){ db=null }
  if(!db){ dbState="local"; schedule(); return; }
  dbState="ok";
  for(const c of COLS){
    let first=true;
    db.collection(c).onSnapshot(snap=>{
      const m={}; for(const d of snap.docs) if(d.exists) m[d.id]=clone(d.data());
      if(first && !snap.metadata.fromCache && c==="sesiones"){ // sube entrenos que solo estaban en el móvil
        for(const id in S.sesiones) if(!m[id]){ m[id]=S.sesiones[id]; db.doc("sesiones/"+id).set(S.sesiones[id]).catch(()=>{}); }
      }
      if(!snap.metadata.fromCache) first=false;
      S[c]=m; LS.set("v2_"+c,m); schedule();
    }, e=>{ dbState="error"; schedule(); });
  }
}

const CAL="Google Calendar";
let mcp=null, cal={events:null,err:null,stamp:null,day:null}, calUnsub=null, newEv=null;
const EVCOL={"1":C.lav,"2":C.sage,"3":C.fuchsia,"4":C.cotton,"5":C.daff,"6":C.peach,"7":C.pool,"8":C.hay,"9":C.sky,"10":C.pool,"11":C.poppy};
function calInput(){ const s=new Date(); s.setHours(0,0,0,0); return {startTime:isoLocal(s),endTime:isoLocal(addDays(s,8)),orderBy:"startTime",pageSize:200} }
async function initCal(){

  watchCal();
}
function setEvents(payload){ const p=payload||{}; cal.events=(p.events||p.items||[]).filter(e=>e&&e.start&&e.status!=="cancelled").map(normEv); cal.err=null }
function watchCal(){
  if(!mcp) return; if(calUnsub) calUnsub(); cal.day=today();
  calUnsub=mcp.watchTool(CAL,"list_events",calInput(),ev=>{
    if(ev.type==="data"){ setEvents(ev.result.payload); cal.stamp=ev.result.cache?.storedAt||Date.now(); }
    else{ const c=ev.error.code; if(["needs_reauth","server_not_connected","blocked_by_policy","approval_required","not_in_manifest","selection_required","not_granted","capability_disabled"].includes(c)) cal.events=null; cal.err=ev.error; }
    schedule();
  },{refetchInterval:300000});
}

/* Categorías para anotar: el emoji va delante del título y el color se guarda en Google */
const EVCATS=[
  {k:"medico",e:"🩺",n:"Médico",c:"11"},{k:"clase",e:"📚",n:"Clase",c:"9"},{k:"entrega",e:"📝",n:"Entrega",c:"6"},
  {k:"tfg",e:"🎓",n:"TFG",c:"3"},{k:"plan",e:"🥂",n:"Plan",c:"4"},{k:"cumple",e:"🎂",n:"Cumple",c:"5"},
  {k:"viaje",e:"✈️",n:"Viaje",c:"2"},{k:"deporte",e:"💪",n:"Deporte",c:"10"},{k:"nota",e:"📌",n:"Nota",c:"8"}];
const vs=x=>x.replace(/️/g,"");
const evCatCol=c=>roles()["ev:"+c.k]||EVCOL[c.c];
function catOf(t){ const v=vs(t||"").trim(); return EVCATS.find(c=>v.startsWith(vs(c.e)))||null }
function stripCat(t){ const c=catOf(t); if(!c) return t; return vs(t).trim().slice(vs(c.e).length).trim() }
function normEv(e){
  const allDay=!e.start?.dateTime;
  const s=allDay?parseYmd(e.start.date):new Date(e.start.dateTime);
  const en=allDay?parseYmd(e.end?.date||e.start.date):new Date(e.end?.dateTime||e.start.dateTime);
  const aviso=!!(e.overrideReminders||[]).some(r=>r.minutes>=1440);
  const t=e.summary||"(sin título)", c=catOf(t);
  return {id:e.id,rec:e.recurringEventId||null,t,s,e:en,allDay,loc:e.location||"",colorId:e.colorId||null,desc:e.description||"",col:(c&&roles()["ev:"+c.k])||EVCOL[e.colorId]||(c?EVCOL[c.c]:null)||C.sky,link:e.htmlLink,aviso,cat:c?c.k:null,yearly:e.eventType==="BIRTHDAY"};
}
/* Rangos largos (mes y año) se piden aparte y se guardan un rato */
let rng={};
async function loadRange(key,start,end){
  if(!mcp) return; const r=rng[key]; if(r&&(r.loading||Date.now()-r.at<300000)) return;
  rng[key]=Object.assign({events:null},r||{},{loading:true});
  try{ let out=[],tok=null;
    for(let i=0;i<8;i++){ const inp={startTime:isoLocal(start),endTime:isoLocal(end),orderBy:"startTime",pageSize:250}; if(tok) inp.pageToken=tok;
      const res=await mcp.callTool(CAL,"list_events",inp); const pl=res.payload||{};
      out=out.concat((pl.events||[]).filter(e=>e&&e.start&&e.status!=="cancelled").map(normEv)); tok=pl.nextPageToken; if(!tok) break; }
    rng[key]={events:out,at:Date.now()};
  }catch(e){ rng[key]={events:(r&&r.events)||null,at:Date.now()-240000,err:e} }
  schedule();
}
function allEvents(){ const m=new Map(); for(const e of (cal.events||[])) m.set(e.id,e); for(const k in rng) for(const e of (rng[k].events||[])) if(!m.has(e.id)) m.set(e.id,e); return [...m.values()] }
const evById=id=>allEvents().find(e=>e.id===id);
function evsOn(list,d){ const a=new Date(d);a.setHours(0,0,0,0); const b=addDays(a,1); return list.filter(e=>e.s<b&&e.e>a).sort((x,y)=>(y.allDay-x.allDay)||(x.s-y.s)) }
function eventsOn(d){ return evsOn(cal.events||[],d) }
function calErrBox(){

}
/* Bloques de estudio/TFG/gym: se marcan como hechos, tachan el tema y suman minutos de foco */
const BLK=/^(📚|🎓\s*TFG|💪\s*Gym|✅)/u;
const isBlock=e=>!e.allDay&&BLK.test(e.t);
const bDone=()=>S.app.bloques||{};
const blockDone=e=>!!bDone()[e.id];
function blockInfo(e){
  const tm=e.t.match(/^✅\s*(.+)$/u); if(tm){ const tk=Object.entries(S.tareas).find(([k,x])=>x.t.trim()===tm[1].trim()); return {materia:null,task:tk?tk[0]:null} }
  const m=e.t.match(/^📚\s*(\S+)\s*(?:·\s*(.+))?$/u);
  if(m){ const code=m[1]==="Estudiar"?(e.t.split(/\s+/).pop()):m[1]; const a=asigs().find(x=>x.code===code); const tema=a&&m[2]?(a.temas||[]).find(t=>t.n===m[2].trim()):null; return {materia:code,a,tema} }
  if(/^🎓\s*TFG/u.test(e.t)) return {materia:"TFG"};
  return {materia:null};
}
function avanzarBlock(id){
  const e=evById(id); if(!e) return; const all=Object.assign({},bDone()), info=blockInfo(e); if(all[id]) return;
  const min=Math.round((e.e-e.s)/60000); let fid=null;
  if(info.materia){ fid=uid(); putDoc("foco",fid,{ymd:ymd(e.s),fecha:new Date().toISOString(),materia:info.materia,min,bloque:id}) }
  if(info.a&&info.tema) setTemas(info.a.id,T=>{const x=T.find(y=>y.id===info.tema.id); if(x){ x.dias=(x.dias||0)+1; x.fecha=null }});
  all[id]={d:today(),foco:fid,parcial:true}; putDoc("app","bloques",all); contOpen=true;
  toast(`⏩ Avanzado${info.materia?` · +${min} min`:""}. ¿Cuándo sigues?`); render() }
function toggleBlock(id){
  const e=evById(id); if(!e) return; const all=Object.assign({},bDone()), info=blockInfo(e);
  if(all[id]){ const r=all[id]; if(r.foco) removeDoc("foco",r.foco); if(info.a&&info.tema) setTemas(info.a.id,T=>{const x=T.find(y=>y.id===info.tema.id); if(x){x.done=false;x.doneEl=null}}); if(info.task&&S.tareas[info.task]) putDoc("tareas",info.task,Object.assign({},S.tareas[info.task],{hecho:false,hechoEl:null})); delete all[id]; putDoc("app","bloques",all); return }
  const min=Math.round((e.e-e.s)/60000); let fid=null;
  if(info.materia){ fid=uid(); putDoc("foco",fid,{ymd:ymd(e.s),fecha:new Date().toISOString(),materia:info.materia,min,bloque:id}) }
  if(info.a&&info.tema) setTemas(info.a.id,T=>{const x=T.find(y=>y.id===info.tema.id); if(x){x.done=true;x.doneEl=today()}});
  if(info.task&&S.tareas[info.task]) putDoc("tareas",info.task,Object.assign({},S.tareas[info.task],{hecho:true,hechoEl:today()}));
  all[id]={d:today(),foco:fid}; putDoc("app","bloques",all);
  toast(info.task?"✓ Tarea hecha":info.tema?`✓ ${info.tema.n} hecho · +${min} min de ${info.materia}`:info.materia?`✓ +${min} min de ${info.materia}`:"✓ Hecho");
}

function lanes(items){ const out={}, arr=[...items].sort((x,y)=>x.a-y.a||y.b-x.b); let grp=[], end=-1;
  const flush=()=>{ const ln=[]; for(const it of grp){ let i=ln.findIndex(b=>b<=it.a); if(i<0){ i=ln.length; ln.push(0) } ln[i]=it.b; it.i=i } for(const it of grp) out[it.key]=[it.i,ln.length]; grp=[] };
  for(const it of arr){ if(it.a>=end&&grp.length) flush(); grp.push(Object.assign({},it)); end=Math.max(end,it.b) } if(grp.length) flush(); return out }
const laneCss=(L,k,g)=>{ const [i,n]=L[k]||[0,1]; return `left:calc(${i}*100%/${n} + ${g}px);width:calc(100%/${n} - ${2*g}px)` };
/* --- DÍA: línea de horas y "Organizar mi día" con las tareas pendientes --- */
let agDia=today(), dprop=null, dBusy=false;
const diaCfg=()=>Object.assign({ini:540,fin:1260,gap:10},S.app.dia||{});
function setDiaCfg(o){ putDoc("app","dia",Object.assign({},diaCfg(),o)); dprop=null }
const t2m=v=>{ const [h,m]=(v||"0:0").split(":").map(Number); return h*60+(m||0) };
function moveDia(n){ agDia=ymd(addDays(parseYmd(agDia),n)); dprop=null; render() }
const tDur=t=>t.dur||60;
function setDur(id,m){ const t=S.tareas[id]; if(t) putDoc("tareas",id,Object.assign({},t,{dur:m})); dprop=null }
function diaCands(day){ const wk=ymd(addDays(parseYmd(day),7));
  const rk=t=>!t.fecha?2:t.fecha<day?0:t.fecha===day?1:3;
  return Object.entries(S.tareas).filter(([k,t])=>!t.hecho&&(!t.fecha||t.fecha<=wk)).sort((a,b)=>rk(a[1])-rk(b[1])||(a[1].fecha||"").localeCompare(b[1].fecha||"")) }
const diaOn=(t,day)=>t.diaSkip!==day&&(t.diaPick===day||!t.fecha||t.fecha<=day);
function pickTask(id){ const t=S.tareas[id]; if(!t) return; const on=diaOn(t,agDia); putDoc("tareas",id,Object.assign({},t,on?{diaSkip:agDia,diaPick:null}:{diaPick:agDia,diaSkip:null})); dprop=null }
function diaBusy(day){ const d=parseYmd(day); return busyOn(d,allEvents()).concat([]) }
function organizar(){
  const day=agDia, cf=diaCfg(), d=parseYmd(day); let start=cf.ini;
  if(day===today()){ const n=new Date(); start=Math.max(start,Math.ceil((n.getHours()*60+n.getMinutes()+5)/15)*15) }
  let free=freeSlots(d,diaBusy(day),[[start,cf.fin]]).map(x=>[x[0],x[1]]);
  const items=[], noFit=[];
  for(const [k,t] of diaCands(day).filter(([k,t])=>diaOn(t,day))){ const dur=tDur(t), sl=free.find(([a,b])=>b-a>=dur);
    if(!sl){ noFit.push(t.t); continue } items.push({id:uid(),tid:k,t:t.t,cat:t.cat,a:sl[0],b:sl[0]+dur}); sl[0]+=dur+cf.gap }
  items.sort((x,y)=>x.a-y.a); dprop={day,items,noFit}; render();
  if(!items.length) toast(noFit.length?"Hoy no queda hueco para esas tareas":"No hay tareas marcadas para hoy");
}
async function pasarAManana(){
  if(!mcp||dBusy) return; const day=agDia, td=today(); let tgt=ymd(addDays(parseYmd(day),1)); if(tgt<td) tgt=td;
  const cf=diaCfg(); dBusy=true; render();
  const tD=parseYmd(tgt); if(rng["d"+tgt]) rng["d"+tgt].at=0; await loadRange("d"+tgt,tD,addDays(tD,1));
  let st=cf.ini; if(tgt===td){ const n=new Date(); st=Math.max(st,Math.ceil((toMin(n)+5)/15)*15) }
  if(tgt===td&&st>=cf.fin){ tgt=ymd(addDays(tD,1)); st=cf.ini; const t2=parseYmd(tgt); await loadRange("d"+tgt,t2,addDays(t2,1)) }
  const pend=evsOn(allEvents(),parseYmd(day)).filter(e=>isBlock(e)&&!blockDone(e)&&!/^💪/u.test(e.t));
  let free=freeSlots(parseYmd(tgt),busyOn(parseYmd(tgt),allEvents()),[[st,cf.fin]]).map(x=>[x[0],x[1]]), ok=0, nof=0;
  for(const e of pend){ const dur=Math.round((e.e-e.s)/60000), sl=free.find(([a,b])=>b-a>=dur); if(!sl){ nof++; continue }
    try{ await mcp.callTool(CAL,"update_event",{eventId:e.id,startTime:`${tgt}T${mm(sl[0])}:00`,endTime:`${tgt}T${mm(sl[0]+dur)}:00`}); sl[0]+=dur+cf.gap; ok++ }
    catch(x){ toast("Paré a mitad: mira la agenda antes de repetir"); break } }
  for(const [k,t] of Object.entries(S.tareas)) if(!t.hecho&&t.fecha===day&&!pend.some(e=>blockInfo(e).task===k)) putDoc("tareas",k,Object.assign({},t,{fecha:tgt}));
  dBusy=false; await calChanged(); toast(ok?`${ok} pasadas al ${fmtDay(parseYmd(tgt),{weekday:"long"})} ✓${nof?` · ${nof} no caben`:""}`:"No hay hueco libre ese día"); render();
}
async function guardarDia(){
  if(!dprop||dBusy||!mcp) return; dBusy=true; render(); let ok=0;
  for(const it of [...dprop.items]){
    try{ await mcp.callTool(CAL,"create_event",{summary:"✅ "+it.t,startTime:`${dprop.day}T${mm(it.a)}:00`,endTime:`${dprop.day}T${mm(it.b)}:00`,colorId:"8",useDefaultReminders:false}); ok++;
      const t=S.tareas[it.tid]; if(t&&!t.fecha) putDoc("tareas",it.tid,Object.assign({},t,{fecha:dprop.day}));
      dprop.items=dprop.items.filter(x=>x.id!==it.id); render() }
    catch(e){ toast(`Paré en "${it.t}": revisa la agenda antes de repetir`); break } }
  dBusy=false; await calChanged(); if(ok) toast(`${ok} tareas puestas en tu día ✓`); if(dprop&&!dprop.items.length) dprop=null; render();
}

function planRange(){ const t=new Date(); t.setHours(0,0,0,0); const dow=(t.getDay()+6)%7;
  if(plan().semana==="esta"){ const st=addDays(t,1); return [st,addDays(t,7-dow)] }
  const st=addDays(t,7-dow); return [st,addDays(st,7)] }

function freeSlots(day,busy,wins){ let free=wins.map(w=>[w[0],w[1]]);
  for(const [a,b] of busy){ const nf=[]; for(const [x,y] of free){ if(b<=x||a>=y){nf.push([x,y]);continue} if(a>x) nf.push([x,a]); if(b<y) nf.push([b,y]) } free=nf }

function takeSlot(free,dur,prefMorning){ const order=prefMorning?free:[...free].reverse(); for(const sl of order){ if(sl[1]-sl[0]>=dur){ const st=prefMorning?sl[0]:sl[0]; const r=[st,st+dur]; sl[0]=st+dur+15; return r } } return null }

function winsFor(d){ const w=d.getDay()===0||d.getDay()===6; return w?[[10*60,14*60]]:[[9*60,14*60],[16*60,21*60]] }
function busyOn(d,evs,skipId,extra){ return evs.filter(e=>e.id!==skipId&&!e.allDay&&!/opcional/i.test(e.t)&&e.s<addDays(d,1)&&e.e>d)
  .map(e=>[ymd(e.s)===ymd(d)?toMin(e.s):0, ymd(e.e)===ymd(d)?toMin(e.e):24*60]).concat((extra||[]).filter(x=>x.d===ymd(d)).map(x=>[x.a,x.b])) }
function nextSlot(dur,from,evs,skipId,extra){
  for(let i=0;i<14;i++){ const d=addDays(from,i); d.setHours(0,0,0,0);
    let fr=freeSlots(d,busyOn(d,evs,skipId,extra),winsFor(d));
    if(i===0){ const nowM=Math.ceil((toMin(from))/15)*15; fr=fr.map(([a,b])=>[Math.max(a,nowM),b]).filter(([a,b])=>b-a>=dur) }
    const sl=fr.find(([a,b])=>b-a>=dur); if(sl) return {d:ymd(d),a:sl[0],b:sl[0]+dur} }
  return null;
}

async function saveEv(){
  const e=newEv; if(!e.t.trim()) return toast("Escribe qué es");
  if(!mcp) return toast("El calendario solo funciona abriendo la app desde Claude");
  if(evBusy) return; evBusy=true; const b=document.getElementById("evbtn"); if(b) b.textContent="Guardando…";
  const c=EVCATS.find(x=>x.k===e.cat);
  const inp={summary:(c?c.e+" ":"")+e.t.trim()};
  if(c&&(!e.id||e.cat!==e.cat0)) inp.colorId=c.c;
  if(e.all){ inp.allDay=true; inp.startTime=e.d+"T00:00:00"; inp.endTime=ymd(addDays(parseYmd(e.d),1))+"T00:00:00"; }
  else{ inp.startTime=`${e.d}T${e.hi}:00`; let fin=`${e.d}T${e.hf}:00`; if(e.hf<=e.hi) fin=`${e.d}T${pad(Math.min(23,+e.hi.slice(0,2)+1))}:${e.hi.slice(3)}:00`; inp.endTime=fin; }
  if(e.id){ if(e.all&&e.df&&e.df>e.d) inp.endTime=ymd(addDays(parseYmd(e.df),1))+"T00:00:00"; }
  if(!e.id||e.aviso!==e.aviso0){ if(e.aviso) inp.overrideReminders=[{method:"popup",minutes:1440}]; else inp.useDefaultReminders=false; }
  if(!e.id&&e.rep==="semanal") inp.recurrenceData=["RRULE:FREQ=WEEKLY"];
  if(!e.id&&e.rep==="anual") inp.recurrenceData=["RRULE:FREQ=YEARLY"];
  let tool="create_event"; if(e.id){ tool="update_event"; inp.eventId=e.id; }
  try{ await mcp.callTool(CAL,tool,inp); agSel=e.d; newEv=null; toast(tool==="create_event"?"Anotado ✓":"Cambios guardados ✓"); await calChanged() }
  catch(err){
    const cd=err&&err.code;
    if(cd==="needs_reauth") toast("Reconecta Google Calendar en Ajustes → Conectores");
    else if(cd==="approval_required") toast("Hace falta tu permiso para guardar en el calendario");
    else if(cd==="tool_error") toast("Google no lo aceptó: revisa fecha y horas");
    else toast("No sé si se guardó: mira la agenda antes de repetir");
  }
  evBusy=false; render();
}

let delArmEv=0;
async function dupEv(dest){
  const e=newEv; if(!e||!e.id||!dest||!mcp||evBusy) return; const o=e.orig||{}; evBusy=true; toast("Duplicando…");
  const c=EVCATS.find(x=>x.k===e.cat), inp={summary:o.t||((c?c.e+" ":"")+e.t.trim())};
  const cid=o.colorId||(c&&c.c); if(cid) inp.colorId=cid; if(o.loc) inp.location=o.loc; if(o.desc) inp.description=o.desc;
  if(e.all){ const span=Math.max(1,Math.round((parseYmd(e.df||e.d)-parseYmd(e.d))/864e5)+1); inp.allDay=true; inp.startTime=dest+"T00:00:00"; inp.endTime=ymd(addDays(parseYmd(dest),span))+"T00:00:00" }
  else{ const sm=t2m(e.hi), dur=Math.max(15,(o.e&&o.s?Math.round((o.e-o.s)/60000):t2m(e.hf)-sm)), en=new Date(parseYmd(dest).getTime()+(sm+dur)*60000);
    inp.startTime=`${dest}T${e.hi}:00`; inp.endTime=`${ymd(en)}T${hm(en)}:00` }
  inp.useDefaultReminders=false;

  for(const [d] of DIAS) for(const [m] of MEALS){ const v=((menu()[d]||{})[m]||"").trim().toLowerCase(); if(!v) continue;
    const r=rs.find(x=>x.n.toLowerCase()===v); if(!r) continue;
    for(const i of ingList(r)) if(!have.has(i.toLowerCase())){ have.add(i.toLowerCase()); add.push(i) } }
  for(const i of add) putDoc("compra",uid(),{t:i,hecho:false,creado:new Date().toISOString(),auto:true});
  toast(add.length?`Añadidos ${add.length} ingredientes ✓`:"Ya tenías todo en la lista (o el menú no usa recetas guardadas)");
}

async function getSample(){ if(sampleReady) return sampleFn; sampleReady=true; try{ sampleFn=await window.claude?.use?.("sample") ?? null }catch(e){ sampleFn=null } return sampleFn }
const ingList=r=>String(r.ing||"").split(/\n|,(?![^(]*\))/).map(x=>x.trim()).filter(Boolean);
const pasosList=r=>String(r.pasos||"").split(/\n/).map(x=>x.replace(/^\s*(\d+[\.\)-]|[-•*])\s*/,"").trim()).filter(Boolean);
function parseRecetaTexto(t){
  const lines=t.split(/\n/).map(l=>l.trim()).filter(Boolean); let mode="", n="", ing=[], pas=[];
  for(const l0 of lines){ if(/^(#[\p{L}\w]+\s*)+$/u.test(l0)) continue; const l=l0.replace(/^[#\s]+/,""), low=l.toLowerCase().replace(/[^\p{L}\s]/gu,"").trim();
    if(/^(ingredientes?|ingredients|necesitas|lista)/.test(low)){ mode="i"; continue }
    if(/^(pasos?|preparaci[oó]n|elaboraci[oó]n|instrucciones|steps|method|modo de hacer|c[oó]mo se hace)/.test(low)){ mode="p"; continue }
    if(!n&&!mode&&l.length<70&&!/^#/.test(l0)){ n=l.replace(/[🔥✨👇⬇️]+/gu,"").trim(); continue }
    const clean=l.replace(/^(\d+[\.\)-]\s+|[-•*✅▪️🔸]\s*)/u,"").trim(); if(!clean||/^#\w/.test(clean)) continue;
    if(mode==="i") ing.push(clean); else if(mode==="p") pas.push(clean);
    else if(/^\d+\s*(g|gr|kg|ml|l|cucharad|cdas?|cdtas?|tazas?|uds?|unidades?|huevos?|lonchas?)\b|^(un|una|dos|tres|medio|media|\d)/i.test(clean)) ing.push(clean);
    else if(/^\d+[\.\)]/.test(l)||clean.length>45) pas.push(clean); }
  return {n:n||"Receta importada",ing:ing.join("\n"),pasos:pas.join("\n"),tipo:"com",keto:""};
}
/* Sacar fotogramas de un vídeo guardado en el móvil (se hace en el propio móvil, no se sube a ningún sitio) */
async function framesDeVideo(file,max){
  const url=URL.createObjectURL(file), v=document.createElement("video");
  v.muted=true; v.playsInline=true; v.setAttribute("playsinline",""); v.preload="auto"; v.src=url;
  v.style.cssText="position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:0"; document.body.appendChild(v);
  try{
    await new Promise((ok,ko)=>{ v.onloadeddata=ok; v.onerror=()=>ko(new Error("vídeo")); setTimeout(()=>ko(new Error("tiempo")),20000); try{ v.load() }catch(e){} });
    try{ await v.play(); v.pause() }catch(e){}
    const dur=v.duration&&isFinite(v.duration)?v.duration:30, n=Math.max(4,Math.min(max,Math.round(dur/4)));
    const W=Math.min(720,v.videoWidth||720), H=Math.round(W*((v.videoHeight||1280)/(v.videoWidth||720)));
    const cv=document.createElement("canvas"); cv.width=W; cv.height=H; const cx=cv.getContext("2d"); const out=[];
    for(let i=0;i<n;i++){ const t=Math.min(dur-0.1,(dur*(i+0.5))/n);
      await new Promise(ok=>{ v.onseeked=ok; v.currentTime=t; setTimeout(ok,4000) });
      cx.drawImage(v,0,0,W,H); const blob=await new Promise(ok=>cv.toBlob(ok,"image/jpeg",0.72)); if(blob) out.push(blob) }
    return out;
  } finally { URL.revokeObjectURL(url); v.remove() }
}
async function addVideo(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  imp.err=""; imp.vid=f.name; imp.vfile=f; imp.busy=true; imp.estado="Preparando el vídeo…"; render();
  try{ const fr=await framesDeVideo(f,10); imp.fotos=[...imp.fotos.filter(x=>!x._v),...fr.map(b=>(b._v=1,b))].slice(0,12) }catch(e){}
  imp.busy=false; await importReceta();
}
async function importReceta(){
  if(imp.busy) return; imp.err="";
  if(!imp.txt.trim()&&!imp.fotos.length&&!imp.vfile){ imp.err="Sube el vídeo, añade capturas o pega el texto del post."; return render() }
  const sp=await getSample();
  if(!sp){ if(!imp.txt.trim()){ imp.err=window.mdStandalone?"Para leer vídeos falta tu clave de IA: Más → Datos → IA para recetas.":"No puedo leer el vídeo aquí: pega el texto del post."; return render() }
    imp.prev=Object.assign(parseRecetaTexto(imp.txt),{fuente:imp.url}); { render(); window.scrollTo(0,0); return } }
  let lim=null; try{ lim=await sp.limits() }catch(e){}
  const useVideo=!!(lim&&lim.video&&imp.vfile&&imp.vfile.size<14e6);
  if(!useVideo&&!imp.fotos.length&&!imp.txt.trim()){ imp.err="No he podido sacar imágenes de ese vídeo. Prueba con capturas de pantalla o pega el texto del post."; return render() }
  imp.busy=true; imp.estado=useVideo?"La IA está viendo el vídeo… (puede tardar 20-40 s)":"Leyendo la receta…"; render();
  const prompt=`Eres un asistente de cocina. A partir del texto, las imágenes y/o el vídeo de una receta de TikTok o Instagram (las imágenes pueden ser capturas o fotogramas del vídeo en orden de tiempo: fíjate en el texto que aparece en pantalla, en los ingredientes que se ven y en lo que hacen para deducir los pasos), devuelve SOLO un JSON con esta forma:
{"n":"nombre corto de la receta en español","tipo":"des"|"com"|"mer"|"cen","raciones":número o null,"ing":["cantidad + ingrediente", ...],"pasos":["paso 1", ...],"keto":"una frase: si es apta para dieta keto y qué cambiar si no lo es"}
Reglas: ingredientes en español, uno por elemento, con cantidad si aparece; pasos claros y cortos; no inventes ingredientes que no aparezcan (si faltan cantidades, déjalas sin cantidad). tipo: des=desayuno, com=comida, mer=merienda, cen=cena (elige el más lógico).
TEXTO DEL POST:
${imp.txt.slice(0,6000)||"(sin texto)"}`;
  try{
    const opts={modelTier:"default"};
    if(useVideo){ opts.video=imp.vfile; const caps=imp.fotos.filter(x=>!x._v); if(caps.length) opts.images=caps }
    else if(imp.fotos.length&&lim&&lim.images) opts.images=imp.fotos;
    const v=await sp.json(prompt,opts);
    if(!v||!(v.ing&&v.ing.length)&&!(v.pasos&&v.pasos.length)) throw {code:"empty"};
    imp.prev={n:v.n||"Receta",tipo:["des","com","mer","cen"].includes(v.tipo)?v.tipo:"com",ing:(v.ing||[]).join("\n"),pasos:(v.pasos||[]).join("\n"),keto:v.keto||"",raciones:v.raciones||null,fuente:imp.url};
    imp.busy=false; { render(); window.scrollTo(0,0); return };
  }catch(e){
    imp.busy=false;
    if(e&&e.code==="bad_key") imp.err="La clave de IA no es válida. Revísala en Más → Datos → IA para recetas.";
    else if(e&&e.code==="rate_limited") imp.err="Gemini (la IA gratuita de Google) está saturado ahora mismo, incluso probando varios modelos. Espera unos minutos y pulsa «Volver a intentar»: el vídeo sigue cargado.";
    else if(e&&e.code==="empty") imp.err="No he encontrado una receta en ese vídeo. Si la explican hablando y el vídeo pesa mucho, pega también la descripción del post.";
    else if(imp.txt.trim()){ imp.prev=Object.assign(parseRecetaTexto(imp.txt),{fuente:imp.url}); { render(); window.scrollTo(0,0); return } }
    else imp.err="No he podido leer la receta"+(e&&e.message?": "+String(e.message).slice(0,140):"")+". Prueba otra vez o con capturas.";
    render();
  }
}

/* --- Foco (pomodoro) --- */
let F=null, fCfg=Object.assign({foco:25,desc:5,materia:"TFG"},LS.get("foco_cfg",{})), fTimer=null;
function focusStart(){ unlockAudio(); keepAwake(); F={materia:fCfg.materia,mode:"foco",end:Date.now()+fCfg.foco*60000,total:fCfg.foco*60,start:Date.now()}; fRun(); render(); say(`Foco de ${fCfg.foco} minutos. ${fCfg.materia}`) }
function focoBlock(id){ const e=evById(id); if(!e) return; const info=blockInfo(e), tk=info.task&&S.tareas[info.task];
  const mat=info.materia||(tk&&tk.cat)||"Otro", dur=Math.max(5,Math.round((e.e-e.s)/60000));
  unlockAudio(); keepAwake(); newEv=null; F={materia:mat,mode:"foco",end:Date.now()+dur*60000,total:dur*60,start:Date.now(),blk:id,blkT:e.t};
  fRun(); estTab="foco"; go("estudio"); say(`Empezamos. ${stripCat(e.t).replace(/^✅\s*/u,"")}, ${dur} minutos`) }
function focusLog(min){ if(min>=1) putDoc("foco",uid(),{ymd:today(),fecha:new Date().toISOString(),materia:F.materia,min:Math.round(min)}) }
function focusStop(){ if(F&&F.mode==="foco"){ const m=(Date.now()-F.start)/60000; if(F.blk&&m>=(F.total/60)*0.8){ const id=F.blk; F=null; clearInterval(fTimer); toggleBlock(id); return render() } focusLog(m) } F=null; clearInterval(fTimer); render() }
function fRun(){ clearInterval(fTimer); fTimer=setInterval(fTick,500) }
function fTick(){
  if(!F) return; const left=Math.ceil((F.end-Date.now())/1000);
  if(left<=0){
    if(F.mode==="foco"&&F.blk){ const id=F.blk; beep(3,990); say("Bloque terminado. ¡Muy bien!"); F=null; clearInterval(fTimer); const e=evById(id); if(e&&!blockDone(e)) toggleBlock(id); else focusLog(0); render(); return }
    if(F.mode==="foco"){ focusLog(F.total/60); beep(3,990); say(`Bien hecho. Descanso de ${fCfg.desc} minutos`); F={materia:F.materia,mode:"desc",end:Date.now()+fCfg.desc*60000,total:fCfg.desc*60} }
    else { beep(3,880); say(`Descanso terminado. Otro bloque de ${F.materia}`); F={materia:F.materia,mode:"foco",end:Date.now()+fCfg.foco*60000,total:fCfg.foco*60,start:Date.now()} }
    render(); return;
  }
  const el=document.getElementById("fcd"); if(el) el.textContent=mmss(left);
  const b=document.getElementById("fbar"); if(b) b.style.width=(100*(1-left/F.total))+"%";
}

}

/* --- Asignaturas: entregas --- */
const entDone=()=>est().hechas||{};
let showHechas={}, entNew={asig:null,t:"",d:"",cal:true}, entBusy=false;
function entregasOf(code){
  const hd=entDone(), now=addDays(new Date(),-1);
  const fromCal=calFor(code).filter(e=>/entrega|examen|prueba|parcial|trabajo/i.test(e.t)&&e.e>now).map(e=>({kind:"ev",id:e.id,t:e.t.replace(/^[⚠️📝\s]+/u,""),d:ymd(e.s),done:!!hd[e.id]}));
  const fromTask=Object.entries(S.tareas).filter(([k,x])=>x.cat===code&&(x.fecha||!x.hecho)).map(([k,x])=>({kind:"task",id:k,t:x.t,d:x.fecha||"",done:!!x.hecho}));
  return [...fromCal,...fromTask].sort((x,y)=>(x.d||"9999").localeCompare(y.d||"9999"));

let resOff=null;
function weekStats(off){ // off=0 esta semana, 1 la anterior
  const ws=addDays(new Date(),-((new Date().getDay()+6)%7)-7*off); ws.setHours(0,0,0,0); const we=addDays(ws,7);
  const a=ymd(ws), b=ymd(we), inW=x=>x&&x>=a&&x<b;
  const foco={}; let fT=0; for(const f of Object.values(S.foco)) if(inW(f.ymd)){ foco[f.materia]=(foco[f.materia]||0)+(f.min||0); fT+=f.min||0 }
  const gym=new Set(sesList().filter(s=>s.ej&&s.ej.some(e=>e.sets.length)&&inW(ymd(new Date(s.fecha)))).map(s=>ymd(new Date(s.fecha)))).size;
  const ndays=off?7:((new Date().getDay()+6)%7)+1; let hc=0; const H=habs();
  for(let i=0;i<ndays;i++){ const d=ymd(addDays(ws,i)); for(const x of H) if(hasHab(d,x.id)) hc++ }
  const hp=H.length?Math.round(100*hc/(H.length*ndays)):0;
  const tk=Object.values(S.tareas).filter(t=>t.hecho&&inW(t.hechoEl)).length + Object.values(entDone()).filter(inW).length;
  const rev=Object.entries(ing().rev).filter(([d])=>inW(d)).reduce((x,[d,n])=>x+n,0);
  const diario=Object.values(S.tfglog).filter(l=>inW(ymd(new Date(l.fecha)))).length;
  return {ws,foco,fT,gym,hp,tk,rev,diario,ing:foco["Inglés"]||0};
}
function cmp(a,b,unit){ if(b==null) return ""; const d=a-b; if(!d) return `<span class="sub">= que la anterior</span>`; return `<span style="color:${d>0?C.pool:C.poppy};font-weight:700;font-size:13px">${d>0?"▲":"▼"} ${unit==="min"?hTxt(Math.abs(d)):Math.abs(d)+(unit||"")}</span>` }

    <div class="card">${mats.length?mats.map(m=>`<div style="margin:8px 0"><div class="row between"><span>${esc(m)}</span><span class="sub">${hTxt(W0.foco[m]||0)}</span></div><div class="pbar" style="background:var(--soft)"><i style="width:${100*(W0.foco[m]||0)/max}%;background:${catCol(m)}"></i></div></div>`).join(""):'<div class="sub">No usaste el modo foco esta semana.</div>'}</div>

const RUN_PLAN=[[8,60,90],[6,120,90],[5,180,90],[4,240,90],[3,360,90],[2,600,120],[2,720,60],[1,1500,0]];
const runWeek=()=>Math.min(8,Math.max(1,(S.app.correr&&S.app.correr.semana)||1));
function runSegs(w){ const [n,c,a]=RUN_PLAN[w-1], g=[{k:"Anda rápido",s:300}];
  for(let i=0;i<n;i++){ g.push({k:"Corre",s:c,run:true}); if(i<n-1&&a) g.push({k:"Anda",s:a}) } g.push({k:"Anda suave",s:300}); return g }
const runMin=w=>Math.round(runSegs(w).reduce((t,x)=>t+x.s,0)/60);
const durTxt=s=>s%60?(s>=60?Math.floor(s/60)+":"+pad(s%60):s+" s"):(s/60)+" min";
function runDesc(w){ const [n,c,a]=RUN_PLAN[w-1]; return n===1?`${durTxt(c)} seguidos corriendo`:`${n} × (${durTxt(c)} correr + ${durTxt(a)} andar)` }
function setRunWeek(w){ putDoc("app","correr",Object.assign({},S.app.correr,{semana:Math.min(8,Math.max(1,w))})); render() }
const segSay=g=>{ const m=Math.floor(g.s/60),r=g.s%60; return `${g.k}, ${m?`${m} ${m===1?"minuto":"minutos"}${r===30?" y medio":r?` y ${r} segundos`:""}`:`${r} segundos`}` };
const rutina=()=>(S.app.rutina&&S.app.rutina.dias)||DEF_RUTINA;
function saveRut(dias){ putDoc("app","rutina",{dias:clone(dias)}) }

const spotifyUrl=()=>(S.app.gym&&S.app.gym.playlist)||"https://open.spotify.com/";
function setPlaylist(v){ v=v.trim(); if(v&&!/^https:\/\/(open\.)?spotify\.(com|link)\//.test(v)) return toast("Pega un enlace de Spotify (Compartir → Copiar enlace)"); putDoc("app","gym",Object.assign({},S.app.gym,{playlist:v||null})); toast(v?"Playlist guardada ✓":"Playlist quitada"); }
const spotBtn=(txt)=>`<a class="btn spot" href="${esc(spotifyUrl())}" target="_blank" rel="noopener">🎵 ${txt}</a>`;
function todayId(){ return ["domingo","lunes","martes","miercoles","jueves","viernes","sabado"][new Date().getDay()] }
function lastFor(n,ex){ for(const s of sesList()){ if(s.id===ex) continue; const e=(s.ej||[]).find(x=>x.n===n); if(e&&e.sets&&e.sets.length) return {sets:e.sets,fecha:s.fecha} } return null }
function bestFor(n){ let b=0; for(const s of sesList()){ const e=(s.ej||[]).find(x=>x.n===n); if(e) for(const st of e.sets||[]) if(+st.kg>b) b=+st.kg } return b||null }
function setTxt(st,pair){ if(st.semana!=null) return `Semana ${st.semana} · ${st.min} min`; if(st.min!=null) return st.min+" min"; if(st.seg!=null) return st.seg+" s"; return pair?`${kgTxt(st.kg)}/${kgTxt(st.kg2)}×${st.reps}`:(st.kg?`${kgTxt(st.kg)}×${st.reps}`:`${st.reps} reps`) }

/* Audio que convive con Spotify: en reposo "ambient" (se mezcla, no corta la música);
   durante un aviso "transient" (baja un momento la música y luego la devuelve). */
let actx=null, duckT=null, speaking=false;
function sess(t){ try{ if(navigator.audioSession) navigator.audioSession.type=t }catch(e){} }
function duck(ms){ sess("transient"); clearTimeout(duckT); duckT=setTimeout(()=>{ if(!speaking) sess("ambient") },ms) }
function unlockAudio(){ sess("ambient"); try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume() }catch(e){} }
function beep(n=1,f=880,dur=.15){ if(!cfg.pitidos||!actx) return; duck(n*250+600); try{ for(let i=0;i<n;i++){ const o=actx.createOscillator(),g=actx.createGain(),t0=actx.currentTime+i*.25;
  o.frequency.value=f; g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(.5,t0+.02); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0+dur+.05) } }catch(e){} }
function say(t){ if(!cfg.voz) return; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang="es-ES";
  speaking=true; duck(15000); const done=()=>{ speaking=false; duck(400) }; u.onend=done; u.onerror=done;
  const v=speechSynthesis.getVoices().find(v=>/^es(-|_)ES/i.test(v.lang)); if(v) u.voice=v; speechSynthesis.speak(u) }catch(e){} }
let wake=null;
let wakeOk=null;
async function keepAwake(){ try{ if("wakeLock" in navigator){ wake=await navigator.wakeLock.request("screen"); wakeOk=true; wake.addEventListener("release",()=>{ if(document.visibilityState==="visible"&&(W||pocket)) keepAwake() }) } else wakeOk=false }catch(e){ wakeOk=false } }
/* Modo bolsillo: pantalla negra, toques bloqueados, el móvil no se bloquea y los avisos siguen. Mantener pulsado para salir. */
let pocket=false, holdT=null;
function pocketOn(){ unlockAudio(); keepAwake(); pocket=true; if(W) W.autoPocket=true; render(); say(W&&W.run?"Modo bolsillo. Te aviso en cada cambio":"Modo bolsillo. Te aviso cuando acabe el descanso") }
let pocketExitAt=0;
function pocketOff(){ pocket=false; pocketExitAt=Date.now(); clearTimeout(holdT); render() }
function pocketHtml(){
  if(!pocket||!W) return "";
  const e=cur(), r=rec(), o=W.rest||W.work;
  const left=o?Math.ceil((o.end-Date.now())/1000):null;
  const top=W.rest?"Descanso":W.work?(W.run?esc(W.run.segs[W.run.i].k):esc(e.n)):"Toca hacer";
  const line=W.run&&W.work?(W.run.segs[W.run.i+1]?`Después: ${esc(W.run.segs[W.run.i+1].k)} ${durTxt(W.run.segs[W.run.i+1].s)}`:"Último tramo"):W.rest?`Después: ${esc(e.n)}${!e.cardio&&!e.run?` · serie ${r.sets.length+1}/${e.s}`:""}`:(o?"":`${esc(e.n)}${!e.cardio&&!e.run?` · serie ${Math.min(r.sets.length+1,e.s)}/${e.s}`:""}`);
  return `<div class="pocket"><div style="font-size:15px;letter-spacing:.1em;text-transform:uppercase">${top}</div>
    <div class="pc" id="pcd">${left!=null?mmss(left):"💪"}</div><div style="font-size:15px">${line}</div>
    <div class="ring" id="pring">mantén<br>pulsado</div>
    <div style="font-size:12px;margin-top:10px;color:#3d3d3d">${wakeOk===false?"Si se apaga la pantalla: Ajustes → Pantalla y brillo → Bloqueo automático → Nunca":"Mantén pulsado 1 segundo para salir"}</div></div>`;
}
const blockEv=ev=>{ if(pocket||(ev.type==="click"&&Date.now()-pocketExitAt<600)){ ev.preventDefault(); ev.stopPropagation() } };
["click","touchmove","wheel","keydown"].forEach(t=>document.addEventListener(t,blockEv,{capture:true,passive:false}));
document.addEventListener("pointerdown",ev=>{ if(!pocket) return; ev.preventDefault(); const rg=document.getElementById("pring"); if(rg) rg.classList.add("hold");
  clearTimeout(holdT); holdT=setTimeout(()=>{ pocketOff(); beep(1,660) },1000) },{capture:true,passive:false});
["pointerup","pointercancel","pointerleave"].forEach(t=>document.addEventListener(t,()=>{ if(!pocket) return; clearTimeout(holdT); const rg=document.getElementById("pring"); if(rg) rg.classList.remove("hold") },{capture:true}));
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ if(W) keepAwake(); if(cal.day&&cal.day!==today()) watchCal(); tick(); schedule(); } });

function startDay(id){
  unlockAudio(); keepAwake(); const R=rutina().find(r=>r.id===id);
  const s={id:String(Date.now()),fecha:new Date().toISOString(),dia:R.dia,titulo:R.t,rid:R.id,fin:false,ej:R.ex.map(e=>({n:e.n,sets:[]}))};
  W={s,R,i:0}; prefill(); LS.set("gym_actual",s); gv="work"; render(); say(`Empezamos ${R.t}. Primer ejercicio: ${R.ex[0].n}`);
}
function resume(){ const s=LS.get("gym_actual",null); if(!s) return; const R=rutina().find(r=>r.id===s.rid); if(!R){LS.del("gym_actual");return}
  unlockAudio(); keepAwake(); let i=R.ex.findIndex((e,k)=>!exDone(e,s.ej[k])); if(i<0) i=R.ex.length-1; W={s,R,i}; prefill(); gv="work"; render(); }
const exDone=(e,r)=>!!r&&(e.cardio||e.run?r.sets.length>0:r.sets.length>=e.s);
const cur=()=>W.R.ex[W.i], rec=()=>W.s.ej[W.i];
function prefill(){ const e=cur(),done=rec().sets,last=lastFor(e.n,W.s.id),i=done.length;
  const p=done[i-1]||(last&&(last.sets[i]||last.sets[last.sets.length-1]))||null;
  W.kg=p?num(p.kg):0; W.kg2=p?num(p.kg2):0; W.reps=(done[i-1]&&done[i-1].reps)||parseInt(e.r)||10; }
function saveW(){ LS.set("gym_actual",W.s); putDoc("sesiones",W.s.id,W.s) }
function logSet(){
  const e=cur(),r=rec();
  if(e.run){ const w=runWeek(); r.sets.push({semana:w,min:runMin(w)}); saveW(); return nextEx(true) }
  if(e.cardio){ r.sets.push({min:e.cardio}); saveW(); return nextEx(true) }
  if(e.t) r.sets.push({seg:e.t}); else r.sets.push(e.pair?{kg:num(W.kg),kg2:num(W.kg2),reps:+W.reps}:{kg:e.nw?0:num(W.kg),reps:+W.reps});
  saveW(); const fin=r.sets.length>=e.s; if(fin&&W.i===W.R.ex.length-1) return finish(); startRest(e.d||60,fin);
}
function undoSet(){ const r=rec(); if(r.sets.length){ r.sets.pop(); saveW(); prefill(); render() } }
function startRest(sec,mv){ W.rest={end:Date.now()+sec*1000,total:sec,warned:false}; if(W.autoPocket) pocket=true; if(mv) W.i=Math.min(W.i+1,W.R.ex.length-1); prefill(); gv="rest"; beep(1,660); runT(); render() }
function endRest(silent){ if(!W||!W.rest) return; W.rest=null; stopT(); gv="work"; render(); if(silent) return; beep(3,990);
  const e=cur(),k=rec().sets.length+1;
  if(e.run) say(`Descanso terminado. Ahora: correr`);
  else if(e.cardio) say(`Descanso terminado. Ahora: ${e.n}, ${e.cardio} minutos`);
  else if(k===1) say(`Descanso terminado. Siguiente ejercicio: ${e.n}. ${e.s} series de ${e.r}${W.kg&&!e.nw?`, con ${kgTxt(W.kg)} kilos`:""}`);
  else say(`Descanso terminado. Serie ${k} de ${e.s}, ${e.n}`); }
function addRest(d){ if(W.rest){ W.rest.end=Math.max(Date.now()+5000,W.rest.end+d*1000); W.rest.total+=d; if(d>0) W.rest.warned=false; render() } }
function startWork(){ unlockAudio(); const e=cur(); if(e.run){ W.run={w:runWeek(),segs:runSegs(runWeek()),i:0,t0:Date.now()}; return runSeg() } const sec=e.cardio?e.cardio*60:e.t; W.work={end:Date.now()+sec*1000,total:sec}; gv="workt"; beep(1,660); runT(); render() }
function runSeg(){ const g=W.run.segs[W.run.i]; W.work={end:Date.now()+g.s*1000,total:g.s}; gv="workt"; beep(g.run?2:1,g.run?990:660); say(segSay(g)); runT(); render() }
function runStop(){ stopT(); W.work=null; W.run=null; gv="work"; render() }
function endWork(silent){ if(!W||!W.work) return;
  if(W.run&&!silent&&W.run.i<W.run.segs.length-1){ W.run.i++; return runSeg() }
  W.work=null; gv="work"; stopT(); if(!silent) beep(3,990); const e=cur();
  if(W.run){ const R=W.run; W.run=null; if(!silent) say("¡Carrera terminada! Muy bien"); rec().sets.push({semana:R.w,min:silent?Math.max(1,Math.round((Date.now()-R.t0)/60000)):runMin(R.w)}); saveW(); return nextEx(true) }
  if(e.cardio){ if(!silent) say(`${e.n} terminado`); rec().sets.push({min:e.cardio}); saveW(); return nextEx(true) }
  if(!silent) say("Tiempo. Descansa"); gv="work"; logSet(); }
function runT(){ stopT(); timer=setInterval(tick,250) }
function stopT(){ if(timer){ clearInterval(timer); timer=null } }
const mmss=s=>{s=Math.max(0,s);return Math.floor(s/60)+":"+pad(s%60)};
function tick(){
  if(!W) return; const o=W.rest||W.work; if(!o) return;
  const left=Math.ceil((o.end-Date.now())/1000);
  if(W.rest&&left<=10&&!W.rest.warned&&W.rest.total>15){ W.rest.warned=true; beep(1,880,.1); say("Diez segundos") }
  if(left<=0) return W.rest?endRest(false):endWork(false);
  const el=document.getElementById("cd"); if(el) el.textContent=mmss(left);
  const pe=document.getElementById("pcd"); if(pe) pe.textContent=mmss(left);
  const b=document.getElementById("cdbar"); if(b) b.style.width=(100*(1-left/o.total))+"%";
}
function nextEx(ann){ stopT(); W.rest=null; W.work=null; if(W.i>=W.R.ex.length-1) return finish(); W.i++; prefill(); gv="work"; render(); if(ann) say(`Siguiente: ${cur().n}`) }
function goEx(i){ stopT(); W.rest=null; W.work=null; W.i=i; prefill(); gv="work"; render() }
function finish(){ pocket=false; stopT(); W.s.fin=true; W.s.finFecha=new Date().toISOString(); saveW(); LS.del("gym_actual"); detailId=W.s.id; const done=W.s; W=null; gv="done"; window._done=done; render(); beep(2,990); say("Entreno terminado. ¡Muy bien!"); try{wake&&wake.release()}catch(e){} }
function abandon(){ if(!W) return; pocket=false; stopT(); if(W.s.ej.some(e=>e.sets.length)){ W.s.fin=true; saveW() } else removeDoc("sesiones",W.s.id); LS.del("gym_actual"); W=null; gv="home"; render() }
function confirmX(){ if(Date.now()-confirmArm<3000) return true; confirmArm=Date.now(); toast("Pulsa otra vez ✕ para terminar y guardar"); return false }

function vGym(){
  if(W) return {work:gWork,rest:gRest,workt:gWorkT,list:gList}[gv]?.()||gWork();
  return {home:gHome,done:gDone,hist:gHist,det:gDet,cfg:gCfg,prog:gProg,rut:gRut}[gv]?.()||gHome();
}
/* --- Progreso por ejercicio y peso corporal --- */
function spark(vals,col,w=280,hgt=60){ if(vals.length<2) return `<div class="sub">${vals.length?"Un registro: necesito al menos dos para la gráfica.":"Sin datos todavía."}</div>`;
  const mn=Math.min(...vals), mx=Math.max(...vals), r=mx-mn||1, step=w/(vals.length-1);
  const pts=vals.map((v,i)=>`${(i*step).toFixed(1)},${(hgt-6-(v-mn)/r*(hgt-12)).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${w} ${hgt}" style="width:100%;height:${hgt}px"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${vals.map((v,i)=>i===vals.length-1?`<circle cx="${(i*step).toFixed(1)}" cy="${(hgt-6-(v-mn)/r*(hgt-12)).toFixed(1)}" r="4.5" fill="${col}"/>`:"").join("")}</svg>` }
function exHistory(n){ return sesList().slice().reverse().map(s=>{const e=(s.ej||[]).find(x=>x.n===n); if(!e||!e.sets.length) return null; const mx=Math.max(...e.sets.map(st=>+st.kg||0)); return mx>0?{f:s.fecha,kg:mx}:null}).filter(Boolean) }
let pesoNew="";
function gProg(){
  const pesos=Object.values(S.peso).sort((a,b)=>a.ymd.localeCompare(b.ymd));
  let h=`<div class="row between"><h2>Progreso</h2><button class="link" onclick="gv='home';render()">Volver</button></div>
    <div class="card"><div class="head" style="${hs('h:Peso corporal','cotton')}"><span class="cap">Peso corporal</span>${pesos.length?`<span class="cap">${kgTxt(pesos[pesos.length-1].kg)} kg</span>`:""}</div>
    ${spark(pesos.slice(-30).map(p=>p.kg),C.fuchsia)}
    ${pesos.length>1?`<div class="note">${(()=>{const d=pesos[pesos.length-1].kg-pesos[0].kg;return `${d<=0?"":"+"}${kgTxt(d)} kg desde el ${esc(fmtDay(parseYmd(pesos[0].ymd),{day:"numeric",month:"short"}))}`})()}</div>`:""}
    <form class="row" style="margin-top:8px" onsubmit="event.preventDefault();const v=num(pesoNew);if(v>20){putDoc('peso',today(),{ymd:today(),kg:v});pesoNew=''}else toast('Escribe tu peso en kg')">
      <input inputmode="decimal" placeholder="Peso de hoy (kg)" value="${esc(pesoNew)}" oninput="pesoNew=this.value"><button class="btn small">Guardar</button></form>
    <div class="note">Solo se guarda uno por día; si repites hoy, se sustituye.</div></div>`;
  for(const R of rutina()){ const exs=R.ex.filter(e=>!e.cardio&&!e.run&&!e.nw&&!e.t); if(!exs.length) continue;
    h+=`<div class="card"><div class="head" style="background:${R.col}"><span class="cap">${esc(R.dia)} · ${esc(R.t)}</span></div>`;
    for(const e of exs){ const hs=exHistory(e.n); const first=hs[0], last=hs[hs.length-1];
      h+=`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="row between"><b style="font-size:15px">${esc(e.n)}</b><span class="sub">${last?`${kgTxt(last.kg)} kg${first&&hs.length>1?` · ${last.kg-first.kg>=0?"+":""}${kgTxt(last.kg-first.kg)}`:""}`:"—"}</span></div>${hs.length>1?spark(hs.map(x=>x.kg),C.pool,280,44):""}</div>` }
    h+=`</div>` }
  return h;
}

/* --- Editor de rutina --- */
let rutDay=null;
function rutEdit(fn){ const d=clone(rutina()); const R=d.find(r=>r.id===rutDay); if(!R) return; fn(R); saveRut(d) }
function exKind(e){ return e.run?"correr":e.cardio?"cardio":e.t?"tiempo":e.nw?"sinpeso":"peso" }
function setKind(i,k){ rutEdit(R=>{ const e=R.ex[i]; delete e.run; delete e.cardio; delete e.t; delete e.nw; delete e.pair;
  if(k==="cardio"){ e.cardio=20; delete e.s; delete e.r; delete e.d } else { e.s=e.s||3; e.r=e.r||"12"; e.d=e.d||60; if(k==="tiempo"){ e.t=30; e.nw=true } if(k==="sinpeso") e.nw=true } }) }
function gRut(){
  const R=rutina().find(r=>r.id===rutDay)||rutina()[0]; rutDay=R.id;
  let h=`<div class="row between"><h2>Editar rutina</h2><button class="link" onclick="gv='home';render()">Listo</button></div>
    <div class="row" style="overflow-x:auto;gap:6px;padding:6px 0">${rutina().map(r=>`<button class="pill" style="padding:8px 12px;font-size:13px;white-space:nowrap;background:${r.id===rutDay?r.col:"var(--soft)"};color:${r.id===rutDay?"#252D45":"var(--mute)"}" onclick="rutDay='${r.id}';render()">${esc(r.dia)}</button>`).join("")}</div>
    <div class="card"><div class="head" style="background:${R.col}"><span class="cap">Nombre del día</span></div>
    <input value="${esc(R.t)}" onchange="rutEdit(R=>R.t=this.value)"></div>`;
  R.ex.forEach((e,i)=>{ const k=exKind(e);
    h+=`<div class="card" style="padding:12px"><div class="row" style="gap:6px"><b style="color:var(--mute)">${i+1}</b><input value="${esc(e.n)}" onchange="rutEdit(R=>R.ex[${i}].n=this.value)">
      <button class="btn small ghost" ${i===0?"disabled style='opacity:.3'":""} onclick="rutEdit(R=>{const t=R.ex[${i}];R.ex[${i}]=R.ex[${i-1}];R.ex[${i-1}]=t})">↑</button>
      <button class="btn small ghost" ${i===R.ex.length-1?"disabled style='opacity:.3'":""} onclick="rutEdit(R=>{const t=R.ex[${i}];R.ex[${i}]=R.ex[${i+1}];R.ex[${i+1}]=t})">↓</button>
      <button class="x" onclick="if(Date.now()-delArm<3000){rutEdit(R=>R.ex.splice(${i},1))}else{delArm=Date.now();toast('Pulsa otra vez para quitarlo')}">✕</button></div>
      <div class="seg" style="margin:8px 0">${[["peso","Con peso"],["sinpeso","Sin peso"],["tiempo","Tiempo"],["cardio","Cardio"]].map(([kk,n])=>`<button class="${k===kk?"on":""}" onclick="setKind(${i},'${kk}')">${n}</button>`).join("")}</div>
      ${k==="correr"?`<div class="sub">Plan de correr de 8 semanas: la semana se elige al empezar el entreno.</div>`:k==="cardio"?`<div class="row between"><span class="sub">Minutos</span><input inputmode="numeric" style="width:90px" value="${e.cardio}" onchange="rutEdit(R=>R.ex[${i}].cardio=Math.max(1,parseInt(this.value)||20))"></div>`:
      `<div class="row" style="gap:8px"><label class="grow"><span class="sub">Series</span><input inputmode="numeric" value="${e.s}" onchange="rutEdit(R=>R.ex[${i}].s=Math.max(1,parseInt(this.value)||3))"></label>
        <label class="grow"><span class="sub">${k==="tiempo"?"Segundos":"Reps"}</span><input value="${esc(k==="tiempo"?e.t:e.r)}" onchange="rutEdit(R=>{${k==="tiempo"?"R.ex["+i+"].t=Math.max(5,parseInt(this.value)||30);R.ex["+i+"].r=this.value+' s'":"R.ex["+i+"].r=this.value"}})"></label>
        <label class="grow"><span class="sub">Descanso (s)</span><input inputmode="numeric" value="${e.d}" onchange="rutEdit(R=>R.ex[${i}].d=Math.max(10,parseInt(this.value)||60))"></label></div>`}</div>` });
  h+=`<div class="row"><button class="btn" onclick="rutEdit(R=>R.ex.push({n:'Nuevo ejercicio',s:3,r:'12',d:60}))">+ Añadir ejercicio</button></div>
    <div class="note">Los cambios se guardan solos. Tus pesos anteriores siguen enlazados mientras el ejercicio se llame igual.</div>
    ${S.app.rutina?`<button class="link mute" onclick="if(Date.now()-delArm<3000){removeDoc('app','rutina');toast('Rutina original restaurada')}else{delArm=Date.now();toast('Pulsa otra vez para volver a la rutina original')}">Volver a la rutina original</button>`:""}`;
  return h;
}

function gHome(){
  const t=todayId(), act=LS.get("gym_actual",null);
  let h=`<div class="row between"><h1>Gym</h1><button class="link" onclick="gv='cfg';render()">Sonido y música</button></div>
    <div class="row" style="margin:8px 0"><button class="btn small ghost" style="flex:1" onclick="gv='prog';render()">📈 Progreso</button><button class="btn small ghost" style="flex:1" onclick="rutDay=todayId();gv='rut';render()">✏️ Editar rutina</button></div>`;
  if(act) h+=`<div class="card"><b>Tienes un entreno a medias</b><div class="sub">${esc(act.dia)} · ${esc(act.titulo)}</div>
    <div class="row" style="margin-top:12px"><button class="btn small" onclick="resume()">Continuar</button><button class="link mute" onclick="LS.del('gym_actual');render()">Descartar</button></div></div>`;
  if(S.app.rutina&&!rutina().some(r=>r.id==="sabado")) h+=`<div class="card" style="background:${C.daff};color:#252D45"><b>Hay una rutina nueva</b><div>Más glúteo, escápulas, core sin máquinas y el plan de correr los sábados. Tu historial de pesos se mantiene.</div><div style="margin-top:10px"><button class="btn small" onclick="removeDoc('app','rutina');toast('Rutina nueva cargada ✓')">Cargar rutina nueva</button></div></div>`;
  h+=`<div style="margin:10px 0 14px">${spotBtn(S.app.gym&&S.app.gym.playlist?"Abrir mi playlist del gym":"Abrir Spotify")}</div>`;
  h+=`<div class="grid2">`+rutina().map(r=>`<button class="day" style="background:${r.col};${r.id===t?"outline:3px solid var(--ink);outline-offset:2px":""}" onclick="startDay('${r.id}')"><b>${esc(r.dia)}</b><span>${esc(r.t)}</span></button>`).join("")+`</div>`;
  const hs=sesList();
  h+=`<div class="card"><div class="row between"><b>Últimos entrenos</b><button class="link" onclick="gv='hist';render()">Ver todo</button></div><div class="list">`+
    (hs.length?hs.slice(0,3).map(s=>`<div class="it" onclick="detailId='${s.id}';gv='det';render()"><span class="grow">${esc(s.dia)} · ${esc(s.titulo)}</span><span class="sub">${esc(fmtDay(new Date(s.fecha),{weekday:"short",day:"numeric",month:"short"}))}</span></div>`).join(""):'<div class="sub">Aún nada.</div>')+`</div></div>
    <div class="note">Durante el entreno, en vez de bloquear el móvil usa <b>🌙 Bolsillo</b>: la pantalla se pone en negro, no se bloquea y te sigue avisando por los cascos.</div>`;
  return h;
}
const prog=()=>Math.round(100*W.R.ex.filter((e,k)=>exDone(e,W.s.ej[k])).length/W.R.ex.length);
function gHeader(){ return `<div class="tile" style="background:${W.R.col};padding:12px 14px"><div class="row between"><button class="link" style="color:#252D45;text-decoration:none" onclick="if(confirmX())abandon()">✕ Salir</button>
  <span class="cap">${esc(W.R.dia)} · ${W.i+1}/${W.R.ex.length}</span><span class="row" style="gap:10px"><button class="link" style="color:#252D45;text-decoration:none" onclick="pocketOn()">🌙</button><a class="link" style="color:#252D45;text-decoration:none" href="${esc(spotifyUrl())}" target="_blank" rel="noopener">🎵</a><button class="link" style="color:#252D45" onclick="gv='list';render()">Lista</button></span></div><div class="pbar"><i style="width:${prog()}%"></i></div></div>` }
function stepper(l,k,st){ return `<div class="step"><label>${esc(l)}</label><div class="ctl"><button onclick="W.${k}=Math.max(0,num(W.${k})-${st});render()">−</button>
  <input inputmode="decimal" value="${esc(String(W[k]).replace(".",","))}" onchange="W.${k}=num(this.value)"><button onclick="W.${k}=num(W.${k})+${st};render()">+</button></div></div>` }
function navRow(){ return `<div class="row between"><button class="link" ${W.i===0?"disabled style='opacity:.3'":""} onclick="goEx(${W.i-1})">‹ Anterior</button>
  <button class="link" onclick="nextEx(false)">${W.i===W.R.ex.length-1?"Terminar":"Saltar ›"}</button></div>` }
function gWork(){
  const e=cur(),r=rec(),last=lastFor(e.n,W.s.id),best=e.nw||e.cardio||e.run?null:bestFor(e.n);
  let h=gHeader()+`<div class="card"><div class="row between"><h2>${esc(e.n)}</h2>${e.pair?`<span class="pill" style="background:${C.fuchsia};color:#fff">Superserie</span>`:""}</div>`;
  if(e.run){ const w=runWeek(),hist=sesList().flatMap(x=>(x.ej||[]).filter(y=>y.n===e.n&&y.sets.length).map(y=>({f:x.fecha,s:y.sets[0]}))).slice(0,3);
    return h+`<div class="row between" style="margin-top:8px"><button class="btn small ghost" ${w<=1?"disabled style='opacity:.3'":""} onclick="setRunWeek(${w-1})">‹</button>
      <div class="center"><div class="cap sub">Semana ${w} de 8</div><div style="font-weight:800;font-size:18px">${esc(runDesc(w))}</div></div>
      <button class="btn small ghost" ${w>=8?"disabled style='opacity:.3'":""} onclick="setRunWeek(${w+1})">›</button></div>
      <div class="sub" style="margin-top:8px">5 min andando rápido para calentar, los intervalos y 5 min andando suave al final · ${runMin(w)} min en total. Ritmo en el que puedas hablar. Te aviso por los cascos en cada cambio.</div>
      ${hist.length?`<div class="note">Últimas: ${hist.map(x=>esc(fmtDay(new Date(x.f),{day:"numeric",month:"short"}))+" · semana "+(x.s.semana||"?")).join(" · ")}</div>`:""}
      <div style="margin-top:16px"><button class="btn" onclick="startWork()">▶ Empezar semana ${w}</button></div>
      <div style="margin-top:10px"><button class="btn ghost" onclick="logSet()">Ya lo he hecho</button></div></div>`+navRow() }
  if(e.cardio) return h+`<div class="sub">${e.cardio} min${e.help?" · "+esc(e.help):""}</div><div style="margin-top:16px"><button class="btn" onclick="startWork()">▶ Empezar ${e.cardio} min</button></div>
    <div style="margin-top:10px"><button class="btn ghost" onclick="logSet()">Ya lo he hecho</button></div></div>`+navRow();
  h+=`<div class="sub">${e.s} series × ${esc(e.r)}${e.help?" · "+esc(e.help):""}</div>`;
  if(last) h+=`<div class="note">Última vez (${esc(fmtDay(new Date(last.fecha),{day:"numeric",month:"short"}))}):</div><div class="chips">${last.sets.map(s=>`<span class="chip prev">${esc(setTxt(s,e.pair))}</span>`).join("")}</div>`;
  if(best) h+=`<div class="note">Tu mejor marca: <b>${kgTxt(best)} kg</b></div>`;
  h+=`</div><div class="card"><div class="row between"><b>Serie ${Math.min(r.sets.length+1,e.s)} de ${e.s}</b>${r.sets.length?`<button class="link mute" onclick="undoSet()">Deshacer</button>`:""}</div>`;
  if(r.sets.length) h+=`<div class="chips">${r.sets.map(s=>`<span class="chip">${esc(setTxt(s,e.pair))}</span>`).join("")}</div>`;
  if(e.t) h+=`<div style="margin-top:14px"><button class="btn" onclick="startWork()">▶ Empezar ${e.t} s</button></div>`;
  else{ if(!e.nw){ h+=stepper(e.pair?e.pair[0]+" kg":"Peso kg","kg",2.5); if(e.pair) h+=stepper(e.pair[1]+" kg","kg2",2.5) }
    h+=stepper("Reps","reps",1)+`<div style="margin-top:10px"><button class="btn ok" onclick="logSet()">✓ Serie hecha · descanso ${e.d}s</button></div>` }
  return h+`</div>`+navRow();
}
function gRest(){ const left=Math.ceil((W.rest.end-Date.now())/1000),e=cur(),r=rec();
  const nx=e.run?`Correr · semana ${runWeek()}`:e.cardio?`${e.n} · ${e.cardio} min`:`${e.n} · serie ${r.sets.length+1}/${e.s}${!e.nw&&W.kg?` · ${kgTxt(W.kg)} kg`:""}`;
  return gHeader()+`<div class="card center"><div class="cap sub">Descanso</div><div class="big" id="cd">${mmss(left)}</div><div class="pbar"><i id="cdbar" style="width:0"></i></div>
    <div class="row" style="justify-content:center;margin-top:14px"><button class="btn ghost small" onclick="addRest(-15)">−15 s</button><button class="btn ghost small" onclick="addRest(15)">+15 s</button></div>
    <div style="margin-top:14px"><button class="btn" style="background:#000;color:#fff" onclick="pocketOn()">🌙 Modo bolsillo</button></div>
    <div style="margin-top:8px"><button class="btn ghost" onclick="endRest(true)">Saltar descanso</button></div></div>
    <div class="tile" style="background:${C.daff}"><div class="cap">A continuación</div><div style="font-weight:700;margin-top:4px">${esc(nx)}</div></div>`; }
function gWorkT(){ if(!W.work){ gv="work"; return gWork() } const left=Math.ceil((W.work.end-Date.now())/1000);
  if(W.run){ const g=W.run.segs[W.run.i],nx=W.run.segs[W.run.i+1],nRun=W.run.segs.filter(x=>x.run).length,kRun=W.run.segs.slice(0,W.run.i+1).filter(x=>x.run).length;
    return gHeader()+`<div class="card center" style="background:${g.run?C.poppy:C.sage};color:#252D45"><div class="cap">Semana ${W.run.w} · ${g.run?`carrera ${kRun} de ${nRun}`:"andando"}</div>
      <div style="font-size:34px;font-weight:900;margin-top:6px">${g.run?"🏃‍♀️ ":"🚶‍♀️ "}${esc(g.k)}</div><div class="big" id="cd">${mmss(left)}</div><div class="pbar"><i id="cdbar" style="width:0"></i></div>
      <div style="margin-top:10px;font-weight:700">${nx?`Después: ${esc(nx.k)} ${esc(durTxt(nx.s))}`:"Último tramo 💪"}</div></div>
      <div style="margin-top:6px"><button class="btn" style="background:#000;color:#fff" onclick="pocketOn()">🌙 Modo bolsillo</button></div>
      <div style="margin-top:8px"><button class="btn ghost" onclick="endWork(false)">Saltar este tramo</button></div>
      <div style="margin-top:8px"><button class="btn ghost" onclick="endWork(true)">Terminar ya y guardar</button></div>
      <div style="margin-top:8px" class="center"><button class="link mute" onclick="runStop()">Cancelar</button></div>` }
  return gHeader()+`<div class="card center"><div class="sub">${esc(cur().n)}</div><div class="big" id="cd">${mmss(left)}</div><div class="pbar"><i id="cdbar" style="width:0"></i></div>
    <div style="margin-top:14px"><button class="btn" onclick="endWork(true)">Terminar ya</button></div>
    <div style="margin-top:8px"><button class="link mute" onclick="stopT();W.work=null;gv='work';render()">Cancelar</button></div></div>`; }
function gList(){ return `<div class="row between"><h2>${esc(W.R.dia)} · ${esc(W.R.t)}</h2><button class="link" onclick="gv=W.rest?'rest':W.work?'workt':'work';render();if(W.rest||W.work)runT()">Volver</button></div>
  <div class="card list">${W.R.ex.map((e,k)=>{const d=exDone(e,W.s.ej[k]),n=W.s.ej[k].sets.length;
    return `<div class="it" onclick="goEx(${k})"><span class="grow">${k===W.i?"▸ ":""}${esc(e.n)}</span><span class="pill" style="background:${d?C.pool:"var(--soft)"};color:${d?"#fff":"var(--mute)"}">${d?"✓":(e.run?"correr":e.cardio?e.cardio+" min":n+"/"+e.s)}</span></div>`}).join("")}</div>`; }
function detBody(s){ return `<div class="card list">${(s.ej||[]).filter(e=>e.sets&&e.sets.length).map(e=>{const def=rutina().flatMap(r=>r.ex).find(x=>x.n===e.n)||{};
  return `<div class="it" style="display:block"><b>${esc(e.n)}</b><div class="chips">${e.sets.map(st=>`<span class="chip">${esc(setTxt(st,def.pair))}</span>`).join("")}</div></div>`}).join("")||'<div class="sub">Sin series apuntadas.</div>'}</div>` }
function gDone(){ const s=window._done||S.sesiones[detailId]; if(!s){gv="home";return gHome()} let n=0,vol=0;
  s.ej.forEach(e=>e.sets.forEach(st=>{n++;vol+=(num(st.kg)+num(st.kg2))*(+st.reps||0)}));
  return `<h1>¡Hecho! 💪</h1><div class="sub">${esc(s.dia)} · ${esc(s.titulo)}</div>
  <div class="tile" style="background:${C.pool};color:#fff"><div class="row between"><span>Duración</span><b>${Math.round((new Date(s.finFecha)-new Date(s.fecha))/60000)} min</b></div>
  <div class="row between"><span>Series</span><b>${n}</b></div><div class="row between"><span>Kilos movidos</span><b>${Math.round(vol).toLocaleString("es-ES")} kg</b></div></div>
  ${runFb(s)}${detBody(s)}<button class="btn" onclick="gv='home';render()">Volver</button>`; }
function runFb(s){ const st=(s.ej||[]).flatMap(e=>e.sets).find(x=>x.semana!=null); if(!st) return ""; const w=st.semana;
  if(runWeek()!==w) return `<div class="tile" style="background:${C.sage}">Próxima carrera: <b>semana ${runWeek()}</b> · ${esc(runDesc(runWeek()))}</div>`;
  return `<div class="card"><b>¿Qué tal la semana ${w}?</b><div class="sub">Si has podido hacer todo sin morir, sube. Si te ha costado mucho, repítela.</div>
    <div class="row" style="margin-top:10px;gap:8px">${w<8?`<button class="btn small ok" style="flex:1" onclick="setRunWeek(${w+1})">Bien · subir a semana ${w+1}</button>`:`<div style="font-weight:700">¡Plan terminado! 🎉</div>`}<button class="btn small ghost" style="flex:1" onclick="setRunWeek(${w});toast('Repites la semana ${w}')">Repetir</button></div></div>` }
function gHist(){ const hs=sesList(); return `<div class="row between"><h2>Historial</h2><button class="link" onclick="gv='home';render()">Volver</button></div>
  <div class="card list">${hs.length?hs.map(s=>`<div class="it" onclick="detailId='${s.id}';gv='det';render()"><span class="grow">${esc(s.dia)} · ${esc(s.titulo)}</span><span class="sub">${esc(fmtDay(new Date(s.fecha),{weekday:"short",day:"numeric",month:"short"}))}</span></div>`).join(""):'<div class="sub">Aún vacío.</div>'}</div>` }
function gDet(){ const s=S.sesiones[detailId]; if(!s){gv="hist";return gHist()}
  return `<div class="row between"><h2>${esc(s.dia)}</h2><button class="link" onclick="gv='hist';render()">Volver</button></div>
  <div class="sub">${esc(s.titulo)} · ${esc(fmtDay(new Date(s.fecha)))}</div>${detBody(s)}
  <button class="link mute" onclick="if(Date.now()-delArm<3000){removeDoc('sesiones','${s.id}');gv='hist';render()}else{delArm=Date.now();toast('Pulsa otra vez para borrar')}">Borrar este entreno</button>` }
function gCfg(){ return `<div class="row between"><h2>Sonido y música</h2><button class="link" onclick="gv='home';render()">Volver</button></div>
  <div class="card"><div class="row between" style="padding:8px 0"><span>Avisos por voz</span><button class="sw ${cfg.voz?"on":""}" onclick="cfg.voz=!cfg.voz;LS.set('gym_cfg',cfg);render()"></button></div>
  <div class="row between" style="padding:8px 0"><span>Pitidos</span><button class="sw ${cfg.pitidos?"on":""}" onclick="cfg.pitidos=!cfg.pitidos;LS.set('gym_cfg',cfg);render()"></button></div>
  <button class="btn ghost" style="margin-top:8px" onclick="unlockAudio();beep(3,990);say('Descanso terminado. Serie dos de hip thrust')">Probar sonido</button>
  <div class="note">Si no oyes nada: quita el modo silencio del iPhone y sube el volumen.</div></div>
  <div class="card"><b>Playlist del gym</b><div class="note">En Spotify: playlist → ··· → Compartir → Copiar enlace, y pégalo aquí.</div>
  <input style="margin-top:8px" placeholder="https://open.spotify.com/playlist/…" value="${esc((S.app.gym&&S.app.gym.playlist)||"")}" onchange="setPlaylist(this.value)"></div>` }

/* ================= ARRANQUE ================= */
(function(){ const a=LS.get("gym_actual",null); if(a&&tab==="gym"){} })();
try{ speechSynthesis.getVoices() }catch(e){}
(function(){ let u=""; try{ u=location.search+location.hash }catch(e){} if(!/[?#&]nueva\b/.test(u)) return;
  tab="agenda"; agView="dia"; agDia=today(); const n=new Date(); qAdd={day:today(),a:Math.min(1410,Math.ceil((toMin(n)+1)/30)*30),dur:60,t:"",kind:"tarea",cat:"Personal",ecat:null,loc:"",notes:"",all:false,rep:"no",aviso:"no"};
  try{ history.replaceState(null,"",location.pathname) }catch(e){}
  setTimeout(()=>{ const i=document.getElementById("qai"); if(i) i.focus() },400) })();
render(); initDb(); initCal();
try{ if("serviceWorker" in navigator && window.top===window.self && location.protocol==="https:" && !/claude/.test(location.hostname)) navigator.serviceWorker.register("sw.js").catch(()=>{}) }catch(e){}
setInterval(()=>{ if(!typing()&&!W) render() },60000);
</script>
